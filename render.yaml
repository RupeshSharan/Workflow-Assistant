services:
  # Node.js API backend service
  - type: web
    name: flowai-api
    env: node
    plan: free
    buildCommand: npm ci && npm run build --workspace @workflow/api
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: flowai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flowai-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://flowai-web.onrender.com
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: OLLAMA_BASE_URL
        value: ""

  # Vite frontend static site service
  - type: web
    name: flowai-web
    env: static
    plan: free
    buildCommand: npm ci && VITE_API_BASE_URL=https://flowai-api.onrender.com/api npm run build --workspace @workflow/web
    publishPath: apps/web/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        src: /*
        dest: /index.html

# Databases
databases:
  - name: flowai-db
    plan: free
    postgresMajorVersion: 16

# Redis
redis:
  - name: flowai-redis
    plan: free
    ipAllowList: []
